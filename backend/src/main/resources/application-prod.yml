# (#5) prod 프로파일 — MySQL (운영 환경)
# 모든 민감 값은 반드시 환경변수로 주입 — 폴백 없음 (미설정 시 즉시 실패)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 운영에서는 직접 DDL 변경 금지 — validate로 스키마 검증만
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

# (#5) prod 환경에서는 HTTPS이므로 secure=true
app:
  cookie:
    secure: true

logging:
  level:
    com.company.community: INFO
    org.hibernate.SQL: WARN

# (#5) 환경 분리 — 공통 설정만 유지, 프로파일별 설정은 application-{profile}.yml에 위치
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

mattermost:
  base-url: ${MM_BASE_URL}

# JWT_SECRET 미설정 시 애플리케이션이 즉시 실패하도록 폴백 제거
jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.company.community: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n"

# (#5) 환경 분리 — 공통 설정만 유지, 프로파일별 설정은 application-{profile}.yml에 위치
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # M-NEW-7: Flyway 기본 OFF — 테스트(H2)는 베이스라인이 MySQL 전용이므로 비활성 유지.
  # dev/prod 프로파일에서 true로 켜고 baseline-on-migrate로 기존 DB도 안전 처리.
  flyway:
    enabled: false

mattermost:
  base-url: ${MM_BASE_URL}

# JWT_SECRET 미설정 시 애플리케이션이 즉시 실패하도록 폴백 제거
jwt:
  secret: ${JWT_SECRET}

# 운영 튜닝 파라미터 — 환경변수로 override 가능
app:
  # 🗓️ 2026-06-02: Access/Refresh 토큰 분리 — 짧은 AT(stateless) + DB 저장 RT(긴 수명).
  jwt:
    access-ttl: ${APP_JWT_ACCESS_TTL:30m}   # Access Token 수명(JWT exp + 쿠키 maxAge)
    refresh-ttl: ${APP_JWT_REFRESH_TTL:14d}  # Refresh Token 수명(DB expires_at + 쿠키 maxAge)
  # 만료 RefreshToken 정리 스케줄러 cron(기본 매일 04:00). 단일 인스턴스 전제.
  refresh-cleanup:
    cron: ${APP_REFRESH_CLEANUP_CRON:0 0 4 * * *}
  # [FEATURE:weekly-digest] 주간 인기글 다이제스트 — 매주 월 09:10 지난 7일 인기 Top N을 전체 ACTIVE 유저에 알림. 단일 인스턴스 전제.
  weekly-digest:
    cron: ${APP_WEEKLY_DIGEST_CRON:0 10 9 * * MON}
    top-n: ${APP_WEEKLY_DIGEST_TOP_N:5}
  # M-NEW-2: CORS 허용 오리진(콤마 구분). 운영은 APP_CORS_ALLOWED_ORIGINS로 실제 도메인 지정 필수.
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ssafy-soop.site,https://www.ssafy-soop.site}"
  # C-NEW-2: 로그인 레이트리밋(IP/loginId 단위 — window 내 max-attempts 초과 시 block-seconds 차단)
  login-rate-limit:
    max-attempts: ${LOGIN_RATE_MAX_ATTEMPTS:5}
    window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:300}
    block-seconds: ${LOGIN_RATE_BLOCK_SECONDS:600}
  # H-NEW-3: Mattermost 호출 타임아웃(ms)
  mattermost:
    connect-timeout-ms: ${MM_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${MM_READ_TIMEOUT_MS:5000}
  # M-NEW-6: 최초 관리자 부트스트랩 — 콤마 구분 MM username. 로그인 시 ADMIN으로 승격(미설정 시 비활성).
  admin:
    bootstrap-usernames: ${APP_ADMIN_BOOTSTRAP_USERNAMES:}

# 관측성 — Actuator. 기본은 health만 웹 노출(민감 엔드포인트 비노출). 헬스 상세는 인증 시에만.
# health는 SecurityConfig에서 permitAll(LB/오케스트레이터 헬스체크용), 그 외는 인증 필요.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true # liveness/readiness 프로브

logging:
  level:
    com.company.community: DEBUG
  pattern:
    # [%X{requestId}] — RequestIdFilter가 넣는 요청 상관관계 ID(없으면 공백)
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%X{requestId:-}] %logger{36} - %msg%n"

server:
  forward-headers-strategy: native

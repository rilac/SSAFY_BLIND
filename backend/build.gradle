plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // 관측성 — 헬스체크
    // 팬텀 토큰/Refresh Token 저장소 — Redis(Lettuce 기본 클라이언트). MySQL refresh_tokens 대체.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // M-NEW-7: Flyway 스키마 마이그레이션(prod=validate 대비 자동 적용, 수동 DDL 대체)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    runtimeOnly 'com.mysql:mysql-connector-j' // (#5) prod 프로파일 MySQL 전환
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2' // @DataJpaTest 용 인메모리 DB (JPQL 검증)
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트는 별도 JVM에서 포크 실행되므로 Gradle CLI의 -D 옵션이 자동으로 전달되지 않는다.
    // GenerateAdminCodeHashTest가 -Dadmin.code를 읽으려면 명시적 전달이 필요하다.
    // (이게 없어서 항상 기본 코드의 해시가 생성되고, 운영자가 지정한 코드와 불일치했다.)
    if (System.getProperty('admin.code') != null) {
        systemProperty 'admin.code', System.getProperty('admin.code')
    }
}
